name: WordPress.org listing

# Updates the directory listing (readme.txt, banner, icon, screenshots) between releases.
on:
  push:
    branches: [ main ]
    paths:
      - 'readme.txt'
      - '.wordpress-org/**'

permissions:
  contents: read

jobs:
  update:
    name: Update readme and assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Off until the plugin is approved: then set the repository variable WPORG_DEPLOY to "true".
    if: vars.WPORG_DEPLOY == 'true'
    environment: wordpress-org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # 2.2.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: oha-deals
          # build/ is not in the repository, so everything except the readme and the assets is ignored.
          IGNORE_OTHER_FILES: true
